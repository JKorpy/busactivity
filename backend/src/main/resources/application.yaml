spring:
  application:
    name: busactivity
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
server:
  port: 8080

logging:
  level:
    com.jkorpy.busactivity: DEBUG
    org.springframework.data.redis: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"


security:
  api-key: ${GTFS_API_KEY}